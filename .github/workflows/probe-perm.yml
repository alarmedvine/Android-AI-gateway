name: probe-perm
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: variants
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          post() {  # $1=tag $2=target(json fragment)
            printf '%-42s ' "$1/$2"
            curl -s -o /tmp/o.json -w 'HTTP %{http_code} ' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases" \
              -d "{\"tag_name\":\"$1\",\"name\":\"$1\",\"draft\":true${2}}"
            python3 -c 'import json;d=json.load(open("/tmp/o.json"));print(d.get("message","OK id="+str(d.get("id"))))'
          }
          TIP=$(git rev-parse HEAD)
          echo "TIP=$TIP  github.sha=${{ github.sha }}"
          post probe-b ",\"target_commitish\":\"$TIP\""
          post probe-c ""
          post probe-d ",\"target_commitish\":\"main\""
          echo "--- 手工建 tag 后只给 tag_name ---"
          git tag probe-e "$TIP" && git push -q origin probe-e && echo "tag pushed"
          post probe-e ""
