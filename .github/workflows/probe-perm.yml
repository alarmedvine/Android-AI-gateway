name: probe-perm
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: tag-then-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD=456e13c821f0e0e0d1e0c8f0e1b6a1e0e0e0e0e0
          OLD=$(git rev-parse 456e13c)
          echo "候选非 tip commit: $OLD  当前 tip: $(git rev-parse HEAD)"
          git tag probe-k "$OLD"
          git push -q origin probe-k && echo "tag probe-k pushed -> $OLD"
          printf 'POST release (existing tag, 无 target_commitish): '
          curl -s -o /tmp/o.json -w 'HTTP %{http_code} ' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d '{"tag_name":"probe-k","name":"probe-k","draft":false}'
          python3 -c 'import json;d=json.load(open("/tmp/o.json"));print(d.get("message","OK id="+str(d.get("id"))+" tag_target="+str(d.get("target_commitish"))))'
